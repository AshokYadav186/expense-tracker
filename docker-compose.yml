version: '3.8'

services:
  # MongoDB Database Container
  mongodb:
    image: mongo:latest
    container_name: expense_tracker_db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: expense-tracker
    volumes:
      - mongo_data:/data/db

  # Node.js Express Backend API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense_tracker_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/expense-tracker
      - JWT_SECRET=docker_production_jwt_secret_key_2026
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb

  # React + Nginx Web Frontend Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense_tracker_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
